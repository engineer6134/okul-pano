<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okul Pano Yönetimi</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--text:#111827;--mut:#6b7280;--pri:#4f86f7;--pri-d:#3b6fe0;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.layout{display:flex;max-width:1200px;margin:0 auto;gap:24px;padding:20px 24px}
nav{width:200px;flex:none}
nav .grp{font-size:11px;font-weight:700;color:#374151;margin:18px 10px 6px;letter-spacing:.04em}
nav .grp:first-child{margin-top:4px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#4b5563;font-weight:600;cursor:pointer;text-decoration:none;font-size:13px}
nav a:hover{background:#e9ecf1}
nav a.on{background:var(--pri);color:#fff}
nav a i{font-style:normal;width:16px;text-align:center}
main{flex:1;max-width:790px;min-width:0}
main h2{margin:4px 0 2px;font-size:22px}
main .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 14px;font-size:14px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin:10px 0 4px}
input[type=text],input[type=number],input[type=time],input[type=url],input[type=password],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--pri)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.row>.auto{flex:none;min-width:0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:9px;padding:9px 18px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:#eef0f4;color:#374151}.btn.sec:hover{background:#e2e5ea}
.btn.del{background:#fee2e2;color:var(--danger);padding:6px 12px}
.count{font-size:11px;color:var(--mut);text-align:right;margin-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
.item .t{flex:1;word-break:break-word}
.item small{color:var(--mut);display:block}
.item img{width:84px;height:52px;object-fit:cover;border-radius:7px;background:#eee}
.empty{text-align:center;color:var(--mut);padding:24px}
.sw{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbd5e1;border-radius:22px;cursor:pointer;transition:.2s}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--pri)}
.sw input:checked+span:before{transform:translateX(18px)}
.tg{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;flex:none;min-width:0}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.toast.err{background:var(--danger)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat div{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:14px}
.stat b{display:block;font-size:18px;margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}
#login .card{width:340px}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){.layout{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap;gap:4px}nav .grp{display:none}.mod-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login"><div class="card"><h3>Yönetici Girişi</h3><label>Şifre</label><input type="password" id="pw" autofocus><div style="margin-top:14px"><button class="btn" style="width:100%" onclick="login()">Giriş</button></div><div id="lerr" style="color:var(--danger);margin-top:8px;font-size:12px"></div><div style="margin-top:14px;text-align:center;font-size:11px;color:var(--mut)">Kodlayan Ali AKDOĞAN</div></div></div>

<header>
  <h1><span class="logo">O</span> Okul Pano Yönetimi</h1>
  <a class="btn" href="/" target="_blank" style="text-decoration:none">🖥 Panoyu Görüntüle</a>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<footer style="text-align:center;padding:6px 0 22px;color:var(--mut);font-size:12px">Kodlayan <b>Ali AKDOĞAN</b></footer>
<div class="toast" id="toast"></div>

<script>
const MENU=[
 ['PANO GÖRÜNÜMÜ',[['general','⚙','Genel ve Görünüm']]],
 ['İÇERİK YÖNETİMİ',[['ann','📢','Duyurular'],['slides','🖼','Slayt Alanı'],['news','📰','Okul Haberleri'],['yt','▶','YouTube Widget\'ı'],['mods','🧩','Özel Modüller'],['spec','🎉','Özel Gün Sayfaları']]],
 ['OKUL BİLGİLERİ',[['teachers','🧑‍🏫','Öğretmenler'],['duty','👥','Nöbet Programı'],['bd','🎂','Doğum Günleri'],['sched','🕒','Ders Saatleri']]],
 ['SİSTEM',[['health','📈','Pano Sağlığı'],['pass','🔑','Şifre Değiştir'],['backup','💾','Yedekleme'],['about','ℹ','Hakkında']]]
];
const TITLES={pass:['Yönetici Şifresi','Yönetim paneli giriş şifresini değiştirin'],teachers:['Öğretmenler','Öğretmen listesi; panoda soyadı baş harfiyle görünür'],news:['Okul Haberleri','Okul sitesindeki haberler slayt alanında otomatik döner'],general:['Genel ve Görünüm','Panonun genel ayarlarını yapın'],ann:['Duyurular','Panoda gösterilecek duyuruları yönetin'],slides:['Slayt Alanı','Panoda dönen görselleri yönetin'],yt:['YouTube Widget\'ı','Panoda oynatılacak YouTube videosu'],spec:['Özel Gün Sayfaları','Öğretmenler Günü, 23 Nisan gibi özel günlerde tam ekran gösterilecek HTML sayfaları'],mods:['Özel Modüller','Kendi HTML kutularınızı panoya ekleyin'],duty:['Nöbet Programı','Aylık nöbet çizelgeleri: Excel\'den yükleyin veya elle düzenleyin'],bd:['Doğum Günleri','Bugün doğum günü olanlar panoda görünür'],sched:['Ders Saatleri','Her gün için ders ve teneffüs saatleri (zil sayacı bunu kullanır)'],health:['Pano Sağlığı','Sunucu ve pano bağlantı durumu'],backup:['Yedekleme','Ayarları yedekleyin veya geri yükleyin'],about:['Hakkında','']};
let S={},cur='ann',KEY=sessionStorage.getItem('k')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const shortName=n=>{const p=String(n||'').trim().split(/\s+/).filter(Boolean);if(p.length<2)return p[0]||'';const last=p.pop();return (p.join(' ')+' '+last.charAt(0)+'.').toLocaleUpperCase('tr')};
const DAYS=['','Pazartesi','Salı','Çarşamba','Perşembe','Cuma'];
let schDay=1,tq='';
const addMin=(t,m)=>{const x=(+t.slice(0,2))*60+(+t.slice(3))+m;return String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2200)}

async function api(method,url,body,raw){
  const h={'x-admin-key':encodeURIComponent(KEY)};
  if(body&&!raw)h['Content-Type']='application/json';
  const r=await fetch(url,{method,headers:{...h,...(raw||{})},body:raw?body:body?JSON.stringify(body):undefined});
  if(r.status===401){$('#login').style.display='grid';throw new Error('Yetkisiz')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Hata');
  return j;
}
const cleanDuty=()=>({...S.duty,schedules:S.duty.schedules.filter(x=>!x._draft).map(({_note,_draft,...r})=>r)});
async function save(sec){try{await api('PUT','/api/state/'+sec,sec==='duty'?cleanDuty():S[sec]);toast('Kaydedildi')}catch(e){toast(e.message,1)}}
async function login(){
  const pw=$('#pw').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok){KEY=pw;sessionStorage.setItem('k',pw);$('#login').style.display='none';init()}else $('#lerr').textContent='Şifre hatalı';
}
$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&login());

function buildNav(){
  $('#nav').innerHTML=MENU.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,i,n])=>`<a data-k="${k}" class="${k===cur?'on':''}"><i>${i}</i>${n}</a>`).join('')).join('');
  document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{cur=a.dataset.k;buildNav();render()});
}
const sw=(id,on)=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><span></span></label>`;
const header=()=>`<h2>${TITLES[cur][0]}</h2><div class="sub">${TITLES[cur][1]}</div>`;

const R={
general(){const s=S.settings;return `<div class="card"><h3>Logolar</h3>
 <div class="row" style="align-items:stretch">${logoBox('logoLeft','Sol logo (okul logosu)',s.logoLeft)}${logoBox('logoRight','Sağ logo (MEB vb.)',s.logoRight)}</div>
 <div style="font-size:12px;color:var(--mut);margin-top:10px">Logolar panoda başlığın iki yanında beyaz kutuda görünür; ortada okul adı yer alır. Yüklenmezse o alan boş kalır. PNG, JPG, WEBP, GIF veya SVG (en fazla 5 MB).</div></div>
 <div class="card"><h3>Pano Ayarları</h3>
 <label>Okul Adı</label><input type="text" id="g_name" value="${esc(s.schoolName)}" placeholder="Örn. Atatürk Ortaokulu">
 <div class="row"><div><label>Tema</label><select id="g_theme">${[['blue','Mavi'],['green','Yeşil'],['red','Kırmızı'],['dark','Koyu']].map(([v,n])=>`<option value="${v}" ${s.theme===v?'selected':''}>${n}</option>`).join('')}</select></div>
 <div><label>Yerleşim</label><select id="g_layout"><option value="split" ${s.layout==='split'?'selected':''}>Slayt + Yan Panel</option><option value="full" ${s.layout==='full'?'selected':''}>Tam Ekran Slayt</option></select></div>
 <div><label>Yan panel genişliği</label><select id="g_side">${[['','Otomatik (ekrana göre)'],['20','Çok dar (%20)'],['24','Dar (%24)'],['28','Normal (%28)'],['33','Geniş (%33)'],['38','Çok geniş (%38)']].map(([v,n])=>`<option value="${v}" ${String(s.sideWidth||'')===v?'selected':''}>${n}</option>`).join('')}</select></div></div>
 <div class="row"><div><label>Görsel / video yerleşimi</label><select id="g_fit"><option value="cover" ${s.imageFit!=='contain'?'selected':''}>Alanı tamamen kapla (kenarlardan kırpılabilir)</option><option value="contain" ${s.imageFit==='contain'?'selected':''}>Tamamını göster (kenarlarda boşluk kalabilir)</option></select></div></div>
 <div class="row"><div><label>Slayt Süresi (sn)</label><input type="number" id="g_sec" min="3" max="120" value="${s.slideSeconds}"></div>
 <div><label>Kayan Yazı Hızı (px/sn)</label><input type="number" id="g_tick" min="20" max="300" value="${s.tickerSpeed}"></div></div>
 <div class="row" style="margin-top:14px"><span class="tg">${sw('g_clock',s.showClock)} Saati göster</span><span class="tg">${sw('g_wx',s.showWeather)} Hava durumunu göster</span></div>
 <label>Hava durumu şehri</label>
 <div class="row"><input type="text" id="g_city" value="${esc(s.weatherCity||'')}" placeholder="Örn. Ankara"><button class="btn sec auto" onclick="findCity()">Şehri Bul</button></div>
 <div id="g_cityinfo" style="font-size:12px;color:var(--mut);margin-top:4px">${s.weatherLat!=null?`Seçili: ${esc(s.weatherLabel||s.weatherCity)} (${(+s.weatherLat).toFixed(2)}, ${(+s.weatherLon).toFixed(2)})`:'Şehir seçilmedi'}</div>
 <div style="margin-top:16px;text-align:right"><button class="btn" onclick="saveGeneral()">Kaydet</button></div></div>`},
ann(){return `<div class="card"><h3>Yeni Duyuru</h3>
 <textarea id="a_text" maxlength="140" placeholder="Duyuru yazısı (Max 140 karakter)" oninput="$('#a_cnt').textContent=this.value.length+'/140'"></textarea>
 <div class="count" id="a_cnt">0/140</div>
 <div class="row" style="margin-top:8px"><span class="tg auto">${sw('a_act',true)} Aktif</span><div class="auto" style="display:flex;align-items:center;gap:8px"><label style="margin:0">Bitiş tarihi (isteğe bağlı)</label><input type="date" id="a_until" style="width:auto;padding:7px;border:1px solid var(--line);border-radius:9px"></div><span></span><button class="btn auto" onclick="addAnn()">💾 Ekle</button></div></div>
 ${S.announcements.length?S.announcements.map((a,i)=>`<div class="item"><span class="tg">${sw('',a.active).replace('<input','<input onchange="togAnn('+i+',this.checked)"')}</span><div class="t">${esc(a.text)}${a.until?`<small style="${a.until<today()?'color:var(--danger)':''}">${a.until<today()?'Süresi doldu: ':'Bitiş: '}${a.until.split('-').reverse().join('.')}</small>`:''}</div><button class="btn del" onclick="delItem('announcements',${i})">Sil</button></div>`).join(''):'<div class="empty">Henüz duyuru eklenmedi</div>'}`},
slides(){return `<div class="card"><h3>Yeni Slayt</h3>
 <label>Görsel (PNG, JPG, GIF, WEBP, MP4)</label><input type="file" id="s_file" accept="image/*,video/mp4">
 <label>Alt yazı (isteğe bağlı)</label><input type="text" id="s_cap" maxlength="100">
 <div style="margin-top:12px;text-align:right"><button class="btn" onclick="addSlide()">Yükle ve Ekle</button></div></div>
 ${S.slides.length?S.slides.map((s,i)=>`<div class="item">${s.url.endsWith('.mp4')?'<span style="font-size:28px">🎬</span>':`<img src="${esc(s.url)}">`}<div class="t">${esc(s.caption||'(alt yazı yok)')}<small>${esc(s.url)}</small></div>
 <button class="btn sec" onclick="mv('slides',${i},-1)">↑</button><button class="btn sec" onclick="mv('slides',${i},1)">↓</button>
 <span class="tg">${sw('',s.active).replace('<input','<input onchange="togItem(\'slides\','+i+',this.checked)"')}</span><button class="btn del" onclick="delSlide(${i})">Sil</button></div>`).join(''):'<div class="empty">Henüz slayt eklenmedi</div>'}`},
yt(){const y=S.youtube;return `<div class="card"><h3>YouTube Videosu</h3>
 <label>Video bağlantısı</label><input type="url" id="y_url" value="${esc(y.url)}" placeholder="https://www.youtube.com/watch?v=...">
 <div class="row" style="margin-top:12px"><span class="tg">${sw('y_act',y.active)} Panoda göster</span><span class="tg">${sw('y_mute',y.muted)} Sessiz</span></div>
 <div style="margin-top:10px;font-size:12px;color:var(--mut)">Etkinse, slayt alanının yerine video oynatılır. Not: TV'nin internet erişimi gerekir.</div>
 <div style="margin-top:14px;text-align:right"><button class="btn" onclick="saveYt()">Kaydet</button></div></div>`},
mods(){return `<div class="card"><h3>Yeni Modül</h3>
 <label>Başlık</label><input type="text" id="m_t" maxlength="40">
 <label>İçerik (HTML veya düz metin)</label><textarea id="m_h" style="min-height:100px" placeholder="&lt;b&gt;Yemek listesi&lt;/b&gt;&lt;br&gt;Mercimek çorbası..."></textarea>
 <div class="row" style="margin-top:8px"><span class="tg auto">${sw('m_act',true)} Aktif</span><span></span><button class="btn auto" onclick="addMod()">Ekle</button></div></div>
 ${S.modules.length?S.modules.map((m,i)=>`<div class="item"><span class="tg">${sw('',m.active).replace('<input','<input onchange="togItem(\'modules\','+i+',this.checked)"')}</span><div class="t"><b>${esc(m.title)}</b><small>${esc(m.html.replace(/<[^>]+>/g,' ').slice(0,90))}</small></div><button class="btn del" onclick="delItem('modules',${i})">Sil</button></div>`).join(''):'<div class="empty">Henüz modül yok</div>'}`},
spec(){
 const L=S.specials||[],td=today(),nowM=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes()})();
 const tm=t=>{const[x,y]=t.split(':').map(Number);return x*60+y};
 const stat=x=>{if(!x.active)return['Pasif','#94a3b8'];if(x.pinned)return['Şu an panoda (elle açık)','#16a34a'];if(!x.from&&!x.to)return['Tarih girilmedi','#d97706'];
  if(x.from&&td<x.from)return['Zamanı bekliyor','#2563eb'];if(x.to&&td>x.to)return['Süresi doldu','#dc2626'];
  if((x.timeFrom&&nowM<tm(x.timeFrom))||(x.timeTo&&nowM>=tm(x.timeTo)))return['Bugün, saat aralığını bekliyor','#2563eb'];return['Şu an panoda','#16a34a']};
 const opt=(i,f,l,v)=>`<span class="tg">${sw('',v).replace('<input','<input onchange="updSpec('+i+',\''+f+'\',this.checked)"')} ${l}</span>`;
 return `<div class="card"><h3>Yeni Özel Gün Sayfası</h3>
 <label>Başlık</label><input type="text" id="sp_t" maxlength="60" placeholder="Öğretmenler Günü">
 <label>HTML dosyası</label><input type="file" id="sp_f" accept=".html,.htm,text/html">
 <label>Fotoğraf (isteğe bağlı; sayfadaki ilk görselin yerine geçer)</label><input type="file" id="sp_i" accept="image/png,image/jpeg,image/webp,image/gif">
 <div class="row" style="margin-top:10px"><div><label>Başlangıç tarihi</label><input type="date" id="sp_from" value="${td}"></div><div><label>Bitiş tarihi</label><input type="date" id="sp_to" value="${td}"></div>
 <div><label>Saat (başlangıç, isteğe bağlı)</label><input type="time" id="sp_tf"></div><div><label>Saat (bitiş, isteğe bağlı)</label><input type="time" id="sp_tt"></div></div>
 <div class="row" style="margin-top:12px"><span class="tg">${sw('sp_hide',true)} Kontrol düğmelerini gizle</span><span class="tg">${sw('sp_auto',true)} Otomatik başlat ve tekrarla</span><span class="tg">${sw('sp_names',true)} Öğretmen adlarını listeden al</span></div>
 <div style="font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5">Sayfa, belirtilen tarih ve saatte panoda tam ekran açılır; süre bitince pano kendiliğinden normale döner. Sayfa yalıtılmış (sandbox) çalışır; yerel görseller sayfa içine gömülü olmalı, internetten gelen görseller için TV'nin internet erişimi gerekir. "Öğretmen adlarını listeden al" yalnızca sayfada <code>names</code> adlı bir liste varsa çalışır.</div>
 <div style="margin-top:14px;text-align:right"><button class="btn" onclick="addSpec()">Yükle ve Ekle</button></div></div>
 ${L.length?L.map((x,i)=>{const[st,c]=stat(x);return `<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><b style="font-size:16px;flex:1">${esc(x.title)}</b><span style="font-size:12px;font-weight:700;color:${c}">● ${st}</span></div>
 <div class="row" style="margin-top:10px"><div><label>Başlangıç</label><input type="date" value="${esc(x.from||'')}" onchange="updSpec(${i},'from',this.value)"></div><div><label>Bitiş</label><input type="date" value="${esc(x.to||'')}" onchange="updSpec(${i},'to',this.value)"></div>
 <div><label>Saat başı</label><input type="time" value="${esc(x.timeFrom||'')}" onchange="updSpec(${i},'timeFrom',this.value)"></div><div><label>Saat sonu</label><input type="time" value="${esc(x.timeTo||'')}" onchange="updSpec(${i},'timeTo',this.value)"></div></div>
 <div class="row" style="margin-top:10px">${opt(i,'active','Aktif',x.active)}${opt(i,'pinned','Şimdi göster (tarihe bakmadan)',x.pinned)}${opt(i,'hideControls','Düğmeleri gizle',x.hideControls!==false)}${opt(i,'autoStart','Otomatik başlat',x.autoStart!==false)}${opt(i,'useTeachers','Adları listeden al',x.useTeachers!==false)}</div>
 <div class="row" style="margin-top:12px;justify-content:flex-end"><a class="btn sec auto" style="text-decoration:none" target="_blank" href="/?special=${esc(x.id)}">Önizle</a><button class="btn del auto" onclick="delSpec(${i})">Sil</button></div></div>`}).join(''):'<div class="empty">Henüz özel gün sayfası eklenmedi</div>'}`},
teachers(){return `<div class="card"><h3>Öğretmen Ekle</h3>

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
async function findCity(){
  const q=$('#g_city').value.trim();if(!q)return toast('Şehir adı girin',1);
  try{const r=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=tr&name='+encodeURIComponent(q))).json();
    if(!r.results||!r.results.length)return toast('Şehir bulunamadı',1);
    const c=r.results[0];Object.assign(S.settings,{weatherCity:q,weatherLat:c.latitude,weatherLon:c.longitude,weatherLabel:[c.name,c.admin1].filter(Boolean).join(', ')});
    $('#g_cityinfo').textContent='Seçili: '+S.settings.weatherLabel+' — Kaydet’e basmayı unutmayın';
  }catch(e){toast('Konum servisine ulaşılamadı',1)}
}
function saveGeneral(){Object.assign(S.settings,{imageFit:$('#g_fit').value,showWeather:$('#g_wx').checked,schoolName:$('#g_name').value.trim(),theme:$('#g_theme').value,layout:$('#g_layout').value,sideWidth:+$('#g_side').value||0,slideSeconds:+$('#g_sec').value||10,tickerSpeed:+$('#g_tick').value||60,showClock:$('#g_clock').checked});save('settings')}
function addAnn(){const t=$('#a_text').value.trim();if(!t)return toast('Yazı boş olamaz',1);S.announcements.unshift({id:uid(),text:t.slice(0,140),active:$('#a_act').checked,until:$('#a_until').value||''});save('announcements').then(render)}
function togAnn(i,v){S.announcements[i].active=v;save('announcements')}
function togItem(sec,i,v){S[sec][i].active=v;save(sec)}
async function delItem(sec,i){if(!confirm('Silinsin mi?'))return;S[sec].splice(i,1);await save(sec);render()}
async function mv(sec,i,d){const j=i+d;if(j<0||j>=S[sec].length)return;[S[sec][i],S[sec][j]]=[S[sec][j],S[sec][i]];await save(sec);render()}
async function addSlide(){

async function clearNews(mode){
  const n=(S.news.items||[]).length;
  const msg=mode==='ignore'?'Arşivdeki '+n+' haber ve görselleri silinecek. Okul sitesinde şu an görünen haberler de yoksayılacak; yalnızca bundan sonra yayınlanan haberler eklenecek. Devam edilsin mi?':'Arşivdeki '+n+' haber ve görselleri silinecek, ardından okul sitesindeki güncel haberler yeniden çekilecek. Devam edilsin mi?';
  if(!confirm(msg))return;
  try{toast('Temizleniyor…');const r=await api('POST','/api/news/clear',{mode});S=await (await fetch('/api/state')).json();render();
    toast(r.warn?r.warn:(mode==='refetch'?r.added+' haber yeniden çekildi':'Tüm haberler temizlendi'),!!r.warn)}catch(e){toast(e.message,1)}
}
async function saveNews(now){
  const sT=$('#n_txt').checked,sI=$('#n_img').checked;
  if(!sT&&!sI)return toast('Metin ve görselden en az biri açık olmalı',1);
  S.news={...S.news,url:$('#n_url').value.trim(),count:+$('#n_cnt').value||8,intervalMin:+$('#n_int').value||30,active:$('#n_act').checked,showText:sT,showImage:sI};
  try{
    await api('PUT','/api/state/news',S.news);
    if(now){toast('Haberler çekiliyor…');const r=await api('POST','/api/news/refresh');toast(r.ok?(r.added?r.added+' yeni haber arşive eklendi':'Yeni haber yok')+' · arşivde '+r.count+' haber':'Hata: '+r.error,!r.ok)}else toast('Kaydedildi');
    S=await (await fetch('/api/state')).json();render();
  }catch(e){toast(e.message,1)}
}

async function addSpec(){
  const t=$('#sp_t').value.trim(),f=$('#sp_f').files[0],im=$('#sp_i').files[0];
  if(!t)return toast('Başlık girin',1);if(!f)return toast('HTML dosyası seçin',1);
  if(!/\.html?$/i.test(f.name))return toast('Dosya .html olmalı',1);
  if(!$('#sp_from').value&&!$('#sp_to').value)return toast('En az bir tarih girin',1);
  try{toast('Yükleniyor…');
    const fr=await upRaw(new File([f],f.name.replace(/\.htm$/i,'.html')));const ir=im?await upRaw(im):null;
    S.specials=S.specials||[];
    S.specials.push({id:uid(),title:t,file:fr.url,image:ir?ir.url:'',from:$('#sp_from').value,to:$('#sp_to').value,timeFrom:$('#sp_tf').value,timeTo:$('#sp_tt').value,active:true,pinned:false,hideControls:$('#sp_hide').checked,autoStart:$('#sp_auto').checked,useTeachers:$('#sp_names').checked});
    await save('specials');render()}catch(e){toast(e.message,1)}

const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const fmtD=d=>d?d.split('-').reverse().join('.'):'—';
const monthName=iso=>iso?MONTHS[+iso.slice(5,7)-1]+' '+iso.slice(0,4):'Çizelge';
const midIso=(f,t)=>{if(!f||!t)return f||t||'';return isoD(new Date((new Date(f+'T12:00:00').getTime()+new Date(t+'T12:00:00').getTime())/2))};
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let dutyCur=null;
function dActive(){const t=today();return S.duty.schedules.filter(x=>!x._draft&&(!x.validFrom||t>=x.validFrom)&&(!x.validTo||t<=x.validTo)).sort((a,b)=>(b.validFrom||'').localeCompare(a.validFrom||''))[0]}
function dCur(){const L=S.duty.schedules;let c=L.find(x=>x.id===dutyCur);if(!c){c=dActive()||L[0]||null;dutyCur=c?c.id:null}return c}
function nextDates(base){
  if(base&&base.validTo){const d=new Date(base.validTo+'T12:00:00');d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);const e=new Date(d);e.setDate(e.getDate()+25);return [isoD(d),isoD(e)]}
  const n=new Date();return [isoD(new Date(n.getFullYear(),n.getMonth(),1)),isoD(new Date(n.getFullYear(),n.getMonth()+1,0))]
}

// ---- Excel'den nöbet okuma (SheetJS tarayıcıda çalışır; sunucu bağımlılığı yok) ----
const asc=s=>String(s??'').toLocaleUpperCase('tr').replace(/[ÇĞİÖŞÜ]/g,c=>({'Ç':'C','Ğ':'G','İ':'I','Ö':'O','Ş':'S','Ü':'U'}[c])).replace(/\s+/g,' ').trim();
const DAYMAP={PAZARTESI:1,SALI:2,CARSAMBA:3,PERSEMBE:4,CUMA:5};
const dayOf=t=>DAYMAP[asc(t).replace(/[^A-Z]/g,'')]||0;
const tokens=n=>asc(n).replace(/[^A-Z0-9]+/g,' ').split(' ').filter(Boolean);
function matchTeacher(raw){
  const a=tokens(raw);if(!a.length)return null;let best=null,bs=0;
  for(const t of S.teachers){
    const b=tokens(t.name);if(!b.length)continue;let sc=0;
    const la=a[a.length-1],lb=b[b.length-1],fa=a[0],fb=b[0];
    const fo=fa===fb?2:(fa.startsWith(fb)||fb.startsWith(fa))?1:0;
    if(la===lb&&fo)sc=10+fo*2;
    else{const sa=new Set(a),sb=new Set(b);const inter=[...sa].filter(x=>sb.has(x)).length;const j=inter/new Set([...sa,...sb]).size;if(j>=.6)sc=5+j}
    if(sc>bs){bs=sc;best=t}
  }
  return best;
}
function loadScript(src){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Excel okuyucu yüklenemedi'));document.head.appendChild(s)})}
async function parseExcel(f){
  await loadScript('/vendor/xlsx.full.min.js');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',blankrows:false,raw:false});
    const r=gridRows(rows);if(r&&r.places.length)return r;
  }
  return null;
}
function gridRows(rows){
  let hi=-1,cols={};
  for(let i=0;i<rows.length;i++){const m={};rows[i].forEach((c,j)=>{const d=dayOf(c);if(d)m[d]=j});if(Object.keys(m).length>=3){hi=i;cols=m;break}}
  if(hi<0)return null;
  const first=Math.min(...Object.values(cols)),places=[];
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];
    const name=String(row.slice(0,first).map(x=>String(x).trim()).find(Boolean)||'');
    const vals={};Object.entries(cols).forEach(([d,j])=>{const v=String(row[j]??'').replace(/\s*\n\s*/g,' ').trim();if(v)vals[d]=v});
    if(/NOBETLER|NOBETCI|MUDUR|GECERLI/.test(asc(name)))break;
    if(!name||!Object.keys(vals).length)continue;
    places.push({name,vals});
  }
  return {places,lines:rows.map(r=>r.map(x=>String(x).trim()).filter(Boolean).join(' '))};
}
function extractMeta(lines){
  let from='',to='',vice='';const z=n=>String(n).padStart(2,'0');
  for(const l of lines){
    const m=l.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})\s*[-–—]\s*(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
    if(m&&!from){from=m[3]+'-'+z(m[2])+'-'+z(m[1]);to=m[6]+'-'+z(m[5])+'-'+z(m[4])}
    const v=l.match(/M[ÜU]D[ÜU]R\s+YARD[İIiı]MC[İIiı]S[İIiı]\s*:?\s*(.+)$/i);
    if(v&&!vice&&v[1].trim())vice=v[1].trim();
  }
  return {from,to,vice};
}
function draftFromResult(res){
  const meta=extractMeta(res.lines);
  const places=res.places.map(p=>({id:uid(),name:p.name}));const cells={};
  let ok=0;const nw=[],mapped=[];
  const pick=txt=>{const t=matchTeacher(txt);if(t){if(tokens(txt).join(' ')!==tokens(t.name).join(' '))mapped.push([txt,t.name]);ok++;return t.id}const n=normName(txt);nw.push(n);return 'new:'+n};
  res.places.forEach((p,i)=>Object.entries(p.vals).forEach(([d,txt])=>{cells[places[i].id+'|'+d]=pick(txt)}));
  const vice=meta.vice?pick(meta.vice):'';
  const uniqNew=[...new Set(nw)];
  let note=`<b>Excel'den okundu:</b> ${places.length} nöbet yeri, ${Object.keys(cells).length} kayıt.`;
  if(mapped.length)note+=`<br>Listedeki adlarla eşleştirildi: ${mapped.slice(0,8).map(m=>esc(m[0])+' → '+esc(m[1])).join('; ')}${mapped.length>8?'…':''}.`;
  if(uniqNew.length)note+=`<br><b>Öğretmen listesinde bulunmayan ${uniqNew.length} isim</b> ➕ ile işaretlendi (${uniqNew.slice(0,6).map(esc).join(', ')}${uniqNew.length>6?'…':''}). Doğru öğretmeni seçebilirsiniz; olduğu gibi bırakırsanız Kaydet'e basınca yeni öğretmen olarak eklenir.`;
  if(!meta.from)note+='<br>Geçerlilik tarihleri dosyada bulunamadı; lütfen aşağıya girin.';
  note+='<br>Kontrol edip <b>Kaydet</b>\'e basın; kaydedilmeden panoda görünmez.';
  return {id:uid(),name:monthName(midIso(meta.from,meta.to)),validFrom:meta.from,validTo:meta.to,vice,places,cells,_draft:true,_note:note};
}
async function dImport(inp){
  const f=inp.files[0];if(!f)return;const msg=$('#du_msg');
  msg.innerHTML='<div style="margin-top:10px;color:var(--mut)">Dosya okunuyor…</div>';

  inp.value='';
}

  }catch(e){toast(e.message,1)}
}
function readSched(){document.querySelectorAll('#sch [data-i]').forEach(e=>{S.schedule.days[schDay][+e.dataset.i][e.dataset.f]=e.value})}
function pickDay(d){readSched();schDay=d;S.schedule.days[d]=S.schedule.days[d]||[];render()}
function addLesson(type){readSched();const a=S.schedule.days[schDay]=S.schedule.days[schDay]||[];const n=a.filter(x=>x.type===type).length+1;const st=a.length?a[a.length-1].end:'08:00';a.push({label:type==='lesson'?n+'. DERS':n+'. TENEFFÜS',start:st,end:addMin(st,type==='lesson'?40:10),type});render()}
function delLesson(i){readSched();S.schedule.days[schDay].splice(i,1);render()}
function saveSched(){readSched();S.schedule.days[schDay].sort((a,b)=>a.start.localeCompare(b.start));save('schedule').then(render)}
function copyDay(){readSched();if(!confirm(DAYS[schDay]+' programı diğer tüm günlerin üzerine yazılacak. Emin misiniz?'))return;const src=JSON.stringify(S.schedule.days[schDay]);for(let d=1;d<=5;d++)if(d!==schDay)S.schedule.days[d]=JSON.parse(src);save('schedule').then(()=>toast('Kopyalandı'))}
async function loadHealth(){
  try{const h=await api('GET','/api/health');const lp=h.lastPing?new Date(h.lastPing.at):null;const ago=lp?Math.round((Date.now()-lp)/1000):null;const ok=ago!==null&&ago<90;
  const up=s=>s>3600?Math.floor(s/3600)+' sa '+Math.floor(s%3600/60)+' dk':Math.floor(s/60)+' dk';
  $('#hstat').innerHTML=`<div>Sunucu<b><span class="dot" style="background:var(--ok)"></span>Çalışıyor</b></div>
   <div>Pano (TV)<b><span class="dot" style="background:${ok?'var(--ok)':'var(--danger)'}"></span>${lp?(ok?'Bağlı':'Yanıt yok'):'Hiç bağlanmadı'}</b>${lp?`<small>${ago} sn önce</small>`:''}</div>
   <div>Çalışma süresi<b>${up(h.uptime)}</b></div><div>İçerik sürümü<b>${h.version}</b></div>
   <div>Yüklemeler<b>${h.uploadCount} dosya</b><small>${(h.uploadBytes/1048576).toFixed(1)} MB</small></div><div>Bellek<b>${h.memoryMB} MB</b></div>`}catch(e){}
}
async function dl(){const r=await fetch('/api/backup',{headers:{'x-admin-key':encodeURIComponent(KEY)}});const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pano-yedek.json';a.click()}
async function restore(){const f=$('#rs').files[0];if(!f)return toast('Dosya seçin',1);if(!confirm('Mevcut veriler üzerine yazılacak. Emin misiniz?'))return;try{await api('POST','/api/restore',JSON.parse(await f.text()));await init();toast('Geri yüklendi')}catch(e){toast('Geçersiz yedek',1)}}

async function init(){
  S=await (await fetch('/api/state')).json();
  buildNav();render();
}
(async()=>{if(KEY){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:KEY})});if(r.ok){$('#login').style.display='none';init()}}})();
</script>
